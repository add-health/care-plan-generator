function getRecommendedPackage(condition, chronicity, durationWeeks, age) {
  const packageKey = CONDITION_TO_PACKAGE[condition] || 'orthopaedic';

  let finalKey = packageKey;
  if (parseInt(age) >= 65 && packageKey === 'orthopaedic') {
    finalKey = 'senior_citizen';
  }

  const pkg = PACKAGES[finalKey];

  // Recommend tier based on chronicity
  let recommendedSessions;
  if (chronicity === 'Acute (< 6 weeks)')          recommendedSessions = 7;
  else if (chronicity === 'Subacute (6–12 weeks)')  recommendedSessions = 14;
  else                                              recommendedSessions = 28;

  // Neurological always starts at 14 minimum
  if (finalKey === 'neurological' && recommendedSessions < 14) {
    recommendedSessions = 14;
  }

  const tier = pkg.tiers.find(t => t.sessions === recommendedSessions)
    || pkg.tiers[1]; // fallback to 14 sessions

  return { pkg, finalKey, tier };
}

function h(tag, attrs, ...children) {
  const el = document.createElement(tag);
  if (attrs) Object.entries(attrs).forEach(([k,v]) => {
    if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2).toLowerCase(), v);
    else el.setAttribute(k, v);
  });
  children.flat().forEach(c => {
    if (c == null || c === false) return;
    el.appendChild(typeof c === 'string' || typeof c === 'number' ? document.createTextNode(c) : c);
  });
  return el;
}
const s = obj => ({ style: obj });

function renderHeader(sub) {
  return h('div', s({background:'linear-gradient(135deg, #1A2744 0%, #1E2D5A 100%)', padding:'16px 20px 18px 20px', display:'flex', alignItems:'center', justifyContent:'space-between', borderBottom:'1px solid rgba(255,255,255,0.08)'}),

function renderStepBar() {
  const steps = ['Patient', 'Condition', 'Clinical'];
  const cur = state.step;
  const bar = h('div', s({background:B.white, padding:'12px 16px', borderBottom:`1px solid ${B.border}`, display:'flex', alignItems:'center'}));
  steps.forEach((name, i) => {
    const done = i < cur, active = i === cur;
    const circle = h('div', s({
      width:26, height:26, borderRadius:13, flexShrink:0,
      background: done?B.blue : active?B.blue : B.border,
      color: done||active ? 'white' : B.muted,
      fontSize:11, fontWeight:700, display:'flex', alignItems:'center', justifyContent:'center'
    }), done ? '✓' : String(i+1));
    const lbl = h('span', s({fontSize:12, fontWeight:active?600:400, color:active?B.navy:B.muted, marginLeft:10}), name);
    bar.appendChild(h('div', s({display:'flex', alignItems:'center', flexShrink:0}), circle, lbl));
    if (i < steps.length - 1) {
      bar.appendChild(h('div', s({flex:1, height:1.5, background:done?B.blue:B.border, margin:'0 10px'})));
    }
  });
  return bar;
}

function renderLabel(text, required) {
  return h('div', s({fontSize:13, fontWeight:600, color:B.navy, marginBottom:10}),
    text, required ? h('span', s({color:B.red, marginLeft:2}), '*') : null
  );
}

function renderInput(val, onchange, placeholder, type='text') {
  const el = h('input', {type, placeholder, value:val, style:{
    width:'100%', padding:'14px 14px', borderRadius:8,
    border:`1px solid ${B.border}`, fontSize:16, color:B.text, background:'white'
  }});
  el.addEventListener('input', e => onchange(e.target.value));
  return el;
}

function renderSelect(val, onchange, options) {
  const el = h('select', s({
    width:'100%', padding:'14px 36px 14px 14px', borderRadius:8,
    border:`1px solid ${B.border}`, fontSize:15, background:'white',
    color:val ? B.text : B.muted
  }));
  const blank = document.createElement('option');
  blank.value = ''; blank.textContent = 'Select...'; el.appendChild(blank);
  options.forEach(o => {
    const opt = document.createElement('option');
    opt.value = o; opt.textContent = o;
    if (o === val) opt.selected = true;
    el.appendChild(opt);
  });
  el.addEventListener('change', e => onchange(e.target.value));
  return el;
}

function renderChips(options, key, toggle, label) {
  const wrap = h('div', s({marginBottom:24}));
  if (label) wrap.appendChild(renderLabel(label));
  const chips = h('div', s({display:'flex', flexWrap:'wrap', gap:7, marginTop:8}));
  options.forEach(o => {
    const sel = (state.form[key]||[]).includes(o);
    const chip = h('button', {type:'button', style:{
      padding:'7px 13px', borderRadius:20,
      border:`1.5px solid ${sel?B.blue:B.border}`,
      background:sel?B.blueLt:'white', color:sel?B.navy:B.muted,
      fontSize:13, fontWeight:sel?600:400, cursor:'pointer'
    }}, o);
    chip.addEventListener('click', () => {
      toggle(o);
      Array.from(chips.children).forEach(sibling => {
        const sibSel = (state.form[key]||[]).includes(sibling.textContent);
        sibling.style.border = `1.5px solid ${sibSel ? B.blue : B.border}`;
        sibling.style.background = sibSel ? B.blueLt : 'white';
        sibling.style.color = sibSel ? B.navy : B.muted;
        sibling.style.fontWeight = sibSel ? '600' : '400';
      });
    });
    chips.appendChild(chip);
  });
  wrap.appendChild(chips);
  return wrap;
}

function renderRadio(options, selected, onChange, label) {
  const wrap = h('div', s({marginBottom:24}));
  if (label) wrap.appendChild(renderLabel(label));
  const group = h('div', s({display:'flex', flexWrap:'wrap', gap:7, marginTop:8}));
  options.forEach(o => {
    const sel = selected === o;
    const btn = h('button', {type:'button', style:{
      padding:'8px 13px', borderRadius:8,
      border:`1.5px solid ${sel?B.blue:B.border}`,
      background:sel?B.blue:'white', color:sel?'white':B.text,
      fontSize:13, fontWeight:sel?600:400, cursor:'pointer'
    }}, o);
    btn.addEventListener('click', () => {
      onChange(o);
      Array.from(group.children).forEach(sibling => {
        const sibSel = sibling.textContent === o;
        sibling.style.border = `1.5px solid ${sibSel ? B.blue : B.border}`;
        sibling.style.background = sibSel ? B.blue : 'white';
        sibling.style.color = sibSel ? 'white' : B.text;
        sibling.style.fontWeight = sibSel ? '600' : '400';
      });
    });
    group.appendChild(btn);
  });
  wrap.appendChild(group);
  return wrap;
}

function renderPainSlider() {
  const v = state.form.painScore;
  const painColor = v <= 3 ? B.blue : v <= 6 ? B.amber : B.red;
  const wrap = h('div', s({marginBottom:24}));
  wrap.appendChild(renderLabel('Pain score (NRS 0–10)', true));
  const row = h('div', s({display:'flex', alignItems:'center', gap:12}));
  const slider = h('input', {type:'range', min:0, max:10, step:1, value:v});
  const badge  = h('div', s({
    width:44, height:44, borderRadius:22, background:painColor,
    color:'white', fontSize:18, fontWeight:700,
    display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0
  }), String(v));
  slider.addEventListener('input', e => {
    const nv = parseInt(e.target.value);
    state.form.painScore = nv;
    badge.textContent = String(nv);
    badge.style.background = nv <= 3 ? B.blue : nv <= 6 ? B.amber : B.red;
  });
  row.appendChild(slider); row.appendChild(badge);
  wrap.appendChild(row);
  wrap.appendChild(h('div', s({display:'flex', justifyContent:'space-between', fontSize:11, color:B.muted, marginTop:5}),
    h('span', null, '0 — No pain'), h('span', null, '10 — Worst pain')
  ));
  return wrap;
}

// Update just the nav button appearance without a full re-render (avoids losing input focus)
function patchNavBtn() {
  const btn = document.getElementById('nav-fwd');
  if (!btn) return;
  const f = state.form;
  const ok = f.name.trim().length > 0 && String(f.age).length > 0;
  btn.style.background = ok ? B.blue : B.border;
  btn.style.color = ok ? 'white' : B.muted;
  btn.style.cursor = ok ? 'pointer' : 'default';
}

function tog(k, v) {
  const arr = state.form[k] || [];
  if (v === 'None') { state.form[k] = ['None']; return; }
  const filtered = arr.filter(x => x !== 'None');
  state.form[k] = filtered.includes(v) ? filtered.filter(x => x !== v) : [...filtered, v];
}

async function generate() {
  const f = state.form;
  const proto = PROTOCOLS.find(p => p.condition === f.condition);
  if (!proto) { state.error = 'Please select a condition first'; render(); return; }

  state.screen = 'loading'; state.error = ''; render();

  const systemPrompt = `You are a senior physiotherapist at Lifetime Health, Bangalore generating personalised home physiotherapy treatment plans.

CRITICAL: Respond ONLY with valid JSON. No markdown code blocks. No explanation text. Pure JSON only.

Required JSON schema:
{
  "clinical_impression": "2-3 sentence clinical assessment including key risk factors",
  "short_term_goals": ["specific measurable goal 1", "goal 2", "goal 3"],
  "long_term_goals": ["full recovery goal 1", "patient-specific functional goal 2"],
  "duration_weeks": 8,
  "visit_frequency": "5x/week (Wk 1-2), 3x/week (Wk 3-6), 2x/week (Wk 7+)",
  "phases": [
    {
      "number": 1,
      "name": "Phase name",
      "week_range": "Week 1-2",
      "goals": ["phase goal 1", "phase goal 2", "phase goal 3"],
      "exercises": [
        {"name": "Exercise name", "prescription": "3 sets x 10 reps, 2x daily"},
        {"name": "Exercise 2", "prescription": "prescription"},
        {"name": "Exercise 3", "prescription": "prescription"},
        {"name": "Exercise 4", "prescription": "prescription"},
        {"name": "Exercise 5", "prescription": "prescription"}
      ],
      "modalities": "specific modality with duration",
      "precautions": "key precautions for this phase"
    }
  ],
  "metrics": [
    {"name": "NRS Pain Score", "baseline": "${f.painScore}/10", "target": "2/10 or less", "frequency": "Every session"},
    {"name": "Condition-specific measure", "baseline": "assessed at first visit", "target": "clinically meaningful target", "frequency": "Every 7 visits"},
    {"name": "Functional outcome", "baseline": "current level", "target": "target level", "frequency": "Every 7 visits"}
  ],
  "pain_trajectory": [
    { "week": 0, "expected": 8, "milestone": "Baseline" },
    { "week": 2, "expected": 6, "milestone": "End of Phase 1" },
    { "week": 4, "expected": 4 },
    { "week": 6, "expected": 3, "milestone": "End of Phase 2" },
    { "week": 8, "expected": 2 },
    { "week": 10, "expected": 2, "milestone": "Discharge target" }
  ],
  "red_flags": ["specific warning sign 1", "warning 2", "warning 3", "warning 4", "warning 5"],
  "home_advice": ["specific advice 1", "advice 2", "advice 3", "advice 4", "advice 5"],
  "package": "package name from protocol",
  "followup": {
    "reassessment_date": "Week X — DD Mon YYYY (calculated from today's date + phase duration)",
    "maintenance_frequency": "e.g. 1x per month after discharge",
    "contact_criteria": [
      "specific symptom or situation 1",
      "specific symptom or situation 2",
      "specific symptom or situation 3",
      "specific symptom or situation 4"
    ],
    "escalation_pathway": "Attending physio → Lifetime Health clinical team"
  }
}

Clinical rules — apply ALL that match the patient profile:
- Use the protocol template as the clinical backbone. Exercises must be appropriate for the condition.
- Age 65+: always include fall prevention in red_flags and home_advice
- Diabetes: add Blood Glucose monitoring to metrics; mention wound healing caution in advice
- Cardiac: add SpO2 monitoring note
- High pain (7+/10): Phase 1 must be conservative — isometric only, no loaded movement
- Chronic (>12 weeks): extend duration_weeks; add pain neuroscience education to home_advice
- Neurological conditions: add caregiver education to home_advice; include GCS monitoring note for stroke
- Short conditions (ankle sprain, Bell's palsy): 2 phases maximum
- followup.reassessment_date: calculate as a real calendar date based on today's date plus the total phase duration. Format as 'Week X — DD Mon YYYY'. Today's date is provided in the user message.
- followup.maintenance_frequency: for acute conditions use '1x per month for 3 months after discharge'. For chronic use 'once every 6 weeks ongoing'. For neurological use '2x per month ongoing — condition is lifelong'.
- followup.contact_criteria: always include 4 items specific to the condition and comorbidities. For diabetic patients include blood glucose spike and wound changes. For elderly (65+) include fall as first item. For neurological include sudden weakness or speech change.
- followup.escalation_pathway: always exactly 'Attending physio → Lifetime Health clinical team'. Never mention any individual name.

Pain trajectory rules — apply ALL:
- Generate one data point every 2 weeks from week 0 to total duration_weeks (inclusive). Week 0 expected = current pain score.
- Final point expected = target pain score from short_term_goals (typically 2 or less).
- Curve shape rules:
  * Acute conditions (ankle sprain, post-surgical Day 1–14, fracture rehab): steep drop in first 4 weeks, then plateau. Drop ~50% of total reduction by week 4.
  * Subacute conditions (rotator cuff, frozen shoulder, LBP 6–12 weeks): linear gradual decline.
  * Chronic conditions (chronic LBP, OA, neck pain >12 weeks): slow gradual decline with minor week-to-week changes.
  * Neurological conditions (stroke, Parkinson's, MS, CP): very gradual reduction; pain may not be primary outcome — plateau at 3–4/10 is acceptable.
- Add "milestone" field at week 0 ("Baseline"), at end of each phase (e.g. "End of Phase 1"), and at final week ("Discharge target"). Omit milestone on intermediate points.`;

  const userMessage = `PROTOCOL TEMPLATE:
${JSON.stringify(proto, null, 2)}

PATIENT ASSESSMENT:
Name: ${f.name || 'Patient'} | Age: ${f.age || 'not specified'}y | Gender: ${f.gender} | Zone: ${f.zone}
Diagnosis: ${f.condition}
Chronicity: ${f.chronicity}
Pain Score: ${f.painScore}/10
Pain Type: ${f.painType.length ? f.painType.join(', ') : 'not specified'}
Pain Frequency: ${f.painFreq.length ? f.painFreq.join(', ') : 'not specified'}
Affected Side: ${f.side}
Functional Status: ${f.functionalStatus}
Mobility: ${f.mobility}
Comorbidities: ${f.comorbidities.length ? f.comorbidities.join(', ') : 'None'}
Neurological Symptoms: ${f.neuro.length ? f.neuro.join(', ') : 'None'}
Patient Goals: ${f.goals || 'return to normal daily activities'}
Clinician Notes: ${f.notes || 'none'}
Today's date: ${new Date().toLocaleDateString('en-GB', {day:'numeric', month:'long', year:'numeric'})}

Generate treatment plan as JSON:`;

  try {
    const res = await fetch(API_ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        system: systemPrompt,
        messages: [{ role: 'user', content: userMessage }]
      })
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error || `Server error ${res.status}`);
    }

    const data = await res.json();
    const text = data.content?.find(b => b.type === 'text')?.text || '';
    const clean = text.replace(/```json\n?/g, '').replace(/```\n?/g, '').trim();
    const parsed = JSON.parse(clean);

    state.plan = { ...parsed, _form: f, _generatedAt: new Date().toLocaleString('en-IN', { day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' }) };
    state.screen = 'plan';

  } catch (err) {
    console.error('Generation error:', err);
    state.error = err.message || 'Generation failed. Check your connection and try again.';
    state.screen = 'form';
  }

  render();
}

function buildWhatsAppText(p, f) {
  const lines = [];
  lines.push(`*Care Plan — ${f.name || 'Patient'}*`);
  if (p._generatedAt) lines.push(p._generatedAt);
  lines.push('');
  lines.push(`*Diagnosis:* ${f.condition}`);
  lines.push(`*Chronicity:* ${f.chronicity}`);
  lines.push(`*Duration:* ${p.duration_weeks} weeks`);
  lines.push(`*Visit plan:* ${p.visit_frequency || ''}`);

  if (p.short_term_goals?.length) {
    lines.push('');
    lines.push('*Short-term goals:*');
    p.short_term_goals.forEach(g => lines.push(`→ ${g}`));
  }

  (p.phases || []).forEach(ph => {
    lines.push('');
    lines.push(`*Phase ${ph.number} — ${ph.name}* (${ph.week_range})`);
    (ph.exercises || []).forEach(ex => lines.push(`• ${ex.name}: ${ex.prescription}`));
    if (ph.modalities) lines.push(`_Modalities: ${ph.modalities}_`);
    if (ph.precautions) lines.push(`⚠ ${ph.precautions}`);
  });

  if (p.home_advice?.length) {
    lines.push('');
    lines.push('*Home advice:*');
    p.home_advice.forEach(a => lines.push(`✓ ${a}`));
  }

  if (p.red_flags?.length) {
    lines.push('');
    lines.push('*See doctor immediately if:*');
    p.red_flags.forEach(r => lines.push(`▸ ${r}`));
  }

  lines.push('');
  lines.push('_Generated by Lifetime Health Care Plan_');
  return lines.join('\n');
}

      fontWeight: 600,
      color: B.navy,
      textTransform: 'uppercase',
      letterSpacing: '0.8px'
    }), 'Pain recovery trajectory'));
    chartTitleRow.appendChild(h('div', s({
      fontSize: 11,
      fontWeight: 500,
      color: B.muted,
      background: B.bg,
      padding: '3px 8px',
      borderRadius: 20,
      border: '1px solid ' + B.border
    }), 'Expected'));
    chartCard.appendChild(chartTitleRow);

    chartCard.appendChild(h('div', s({
      fontSize: 12,
      color: B.muted,
      marginBottom: 14,
      lineHeight: '1.4'
    }), 'Estimated pain reduction over your recovery period'));

    // SVG chart
    const W_c = 480, H_c = 200;
    const PAD = { top: 20, right: 30, bottom: 32, left: 32 };
    const cw_c = W_c - PAD.left - PAD.right;
    const ch_c = H_c - PAD.top - PAD.bottom;

    const maxWeek = Math.max(...pt.map(d => d.week));
    const xScale = w => PAD.left + (w / maxWeek) * cw_c;
    const yScale = v => PAD.top + (1 - v / 10) * ch_c;

    const ns = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(ns, 'svg');
    svg.setAttribute('viewBox', `0 0 ${W_c} ${H_c}`);
    svg.setAttribute('width', '100%');
    svg.style.maxWidth = W_c + 'px';
    svg.style.height = 'auto';
    svg.style.display = 'block';

    // Background zones
    const goodZone = document.createElementNS(ns, 'rect');
    goodZone.setAttribute('x', PAD.left);
    goodZone.setAttribute('y', yScale(4));
    goodZone.setAttribute('width', cw_c);
    goodZone.setAttribute('height', yScale(0) - yScale(4));
    goodZone.setAttribute('fill', '#F0FDF4');
    svg.appendChild(goodZone);

    const alertZone = document.createElementNS(ns, 'rect');
    alertZone.setAttribute('x', PAD.left);
    alertZone.setAttribute('y', yScale(10));
    alertZone.setAttribute('width', cw_c);
    alertZone.setAttribute('height', yScale(6) - yScale(10));
    alertZone.setAttribute('fill', '#FEF2F2');
    svg.appendChild(alertZone);

    // Grid lines
    for (let v = 0; v <= 10; v += 2) {
      const line = document.createElementNS(ns, 'line');
      line.setAttribute('x1', PAD.left);
      line.setAttribute('x2', PAD.left + cw_c);
      line.setAttribute('y1', yScale(v));
      line.setAttribute('y2', yScale(v));
      line.setAttribute('stroke', '#E2E8F0');
      line.setAttribute('stroke-width', '0.5');
      svg.appendChild(line);

      const ylabel = document.createElementNS(ns, 'text');
      ylabel.setAttribute('x', PAD.left - 6);
      ylabel.setAttribute('y', yScale(v) + 3);
      ylabel.setAttribute('text-anchor', 'end');
      ylabel.setAttribute('font-size', '9');
      ylabel.setAttribute('fill', B.muted);
      ylabel.setAttribute('font-family', 'sans-serif');
      ylabel.textContent = v;
      svg.appendChild(ylabel);
    }

    // X-axis week labels
    pt.forEach(d => {
      const xlabel = document.createElementNS(ns, 'text');
      xlabel.setAttribute('x', xScale(d.week));
      xlabel.setAttribute('y', H_c - 14);
      xlabel.setAttribute('text-anchor', 'middle');
      xlabel.setAttribute('font-size', '9');
      xlabel.setAttribute('fill', B.muted);
      xlabel.setAttribute('font-family', 'sans-serif');
      xlabel.textContent = 'W' + d.week;
      svg.appendChild(xlabel);
    });

    // Trajectory line — smooth path
    const linePath = pt.map((d, i) =>
      (i === 0 ? 'M' : 'L') + xScale(d.week) + ',' + yScale(d.expected)
    ).join(' ');

    const trajPath = document.createElementNS(ns, 'path');
    trajPath.setAttribute('d', linePath);
    trajPath.setAttribute('stroke', '#3B6FE8');
    trajPath.setAttribute('stroke-width', '2.5');
    trajPath.setAttribute('fill', 'none');
    trajPath.setAttribute('stroke-linecap', 'round');
    trajPath.setAttribute('stroke-linejoin', 'round');

    // Filled area under line
    const areaPath = linePath + ` L ${xScale(maxWeek)},${yScale(0)} L ${xScale(0)},${yScale(0)} Z`;
    const area = document.createElementNS(ns, 'path');
    area.setAttribute('d', areaPath);
    area.setAttribute('fill', '#3B6FE8');
    area.setAttribute('fill-opacity', '0.08');
    svg.appendChild(area);
    svg.appendChild(trajPath);

    // Data points + value labels
    pt.forEach(d => {
      const dot = document.createElementNS(ns, 'circle');
      dot.setAttribute('cx', xScale(d.week));
      dot.setAttribute('cy', yScale(d.expected));
      dot.setAttribute('r', d.milestone ? 5 : 3.5);
      dot.setAttribute('fill', '#3B6FE8');
      dot.setAttribute('stroke', 'white');
      dot.setAttribute('stroke-width', '2');
      svg.appendChild(dot);

      const vlabel = document.createElementNS(ns, 'text');
      vlabel.setAttribute('x', xScale(d.week));
      vlabel.setAttribute('y', yScale(d.expected) - 9);
      vlabel.setAttribute('text-anchor', 'middle');
      vlabel.setAttribute('font-size', '10');
      vlabel.setAttribute('font-weight', '700');
      vlabel.setAttribute('fill', B.navy);
      vlabel.setAttribute('font-family', 'sans-serif');
      vlabel.textContent = d.expected;
      svg.appendChild(vlabel);
    });

    chartCard.appendChild(svg);

    // Legend
    const legend = h('div', s({
      display: 'flex',
      gap: 16,
      marginTop: 10,
      fontSize: 11,
      color: B.muted,
      flexWrap: 'wrap'
    }));
    legend.appendChild(h('div', s({display:'flex',alignItems:'center',gap:6}),
      h('span', s({width:10, height:10, borderRadius:5, background:'#F0FDF4', border:'1px solid #BBF7D0', display:'inline-block'})),
      'Goal zone (0–4)'
    ));
    legend.appendChild(h('div', s({display:'flex',alignItems:'center',gap:6}),
      h('span', s({width:10, height:10, borderRadius:5, background:'#FEF2F2', border:'1px solid #FECACA', display:'inline-block'})),
      'Alert zone (6+)'
    ));
    chartCard.appendChild(legend);

    // Disclaimer
    chartCard.appendChild(h('div', s({
      marginTop: 12,
      padding: '8px 10px',
      background: '#FFF7ED',
      border: '1px solid #FED7AA',
      borderRadius: 6,
      fontSize: 11,
      color: '#92400E',
      lineHeight: '1.4'
    }), '\u26a0 Estimate based on typical recovery for this condition. Individual recovery varies \u2014 discuss any concerns with your physiotherapist.'));

    body.appendChild(chartCard);
  }

  // Follow-up & continuity
  const fu = p.followup;
  if (fu) {
    const block = h('div', s({
      background: 'white',
      borderRadius: 10,
      padding: 14,
      marginBottom: 12,
      borderLeft: '4px solid ' + B.blue,
      border: '1.5px solid ' + B.blue
    }));

    // Title row
    const titleRow = h('div', s({
      display: 'flex',
      alignItems: 'center',
      justifyContent: 'space-between',
      marginBottom: 12
    }));
    titleRow.appendChild(h('div', s({
      fontSize: 11,
      fontWeight: 600,
      color: B.blue,
      textTransform: 'uppercase',
      letterSpacing: '0.8px'
    }), 'Follow-up & continuity'));
    titleRow.appendChild(h('div', s({
      fontSize: 11,
      fontWeight: 500,
      color: B.muted,
      background: B.bg,
      padding: '3px 8px',
      borderRadius: 20,
      border: '1px solid ' + B.border
    }), 'AI-generated'));
    block.appendChild(titleRow);

    // Disclaimer banner
    const disclaimer = h('div', s({
      display: 'flex',
      alignItems: 'flex-start',
      gap: 8,
      padding: '9px 12px',
      borderRadius: 8,
      background: '#FFF7ED',
      border: '1px solid #FED7AA',
      marginBottom: 14
    }));
    disclaimer.appendChild(h('span', s({
      fontSize: 16,
      flexShrink: 0,
      marginTop: 1
    }), '⚠'));
    const disclaimerText = h('div', s({
      fontSize: 12,
      color: '#92400E',
      lineHeight: '1.5'
    }));
    disclaimerText.appendChild(h('strong', null, 'AI-generated suggestion. '));
    disclaimerText.appendChild(document.createTextNode(
      'Confirm dates and criteria with your supervising ' +
      'physiotherapist or '));
    const consultLink = h('a', {
      href: 'https://lth.doctor/consultation',
      target: '_blank',
      style: {
        color: '#92400E',
        fontWeight: '600',
        textDecoration: 'underline'
      }
    }, 'book a free expert consultation');
    disclaimerText.appendChild(consultLink);
    disclaimer.appendChild(disclaimerText);
    block.appendChild(disclaimer);

    // Two stat cards — reassessment + maintenance
    const grid = h('div', s({
      display: 'grid',
      gridTemplateColumns: '1fr 1fr',
      gap: 10,
      marginBottom: 14
    }));
    [
      ['Next reassessment', fu.reassessment_date],
      ['Maintenance visits', fu.maintenance_frequency]
    ].forEach(([label, value]) => {
      const card = h('div', s({
        background: B.blueLt,
        borderRadius: 8,
        padding: '10px 12px'
      }));
      card.appendChild(h('div', s({
        fontSize: 11,
        color: B.muted,
        fontWeight: 600,
        marginBottom: 5
      }), label));
      card.appendChild(h('div', s({
        fontSize: 13,
        fontWeight: 700,
        color: B.navy,
        lineHeight: '1.4'
      }), value || '—'));
      grid.appendChild(card);
    });
    block.appendChild(grid);

    // Contact criteria
    block.appendChild(h('div', s({
      fontSize: 12,
      fontWeight: 600,
      color: B.navy,
      marginBottom: 8
    }), 'Call your therapist if:'));
    const criteriaWrap = h('div', s({ marginBottom: 14 }));
    (fu.contact_criteria || []).forEach((item, i) => {
      criteriaWrap.appendChild(h('div', s({
        fontSize: 13,
        color: B.text,
        padding: '5px 0',
        borderBottom: '1px solid ' + B.border,
        lineHeight: '1.4',
        display: 'flex',
        alignItems: 'flex-start',
        gap: 8
      }),
        h('span', s({
          color: B.blue,
          fontWeight: 700,
          flexShrink: 0,
          fontSize: 14
        }), '·'),
        item
      ));
    });
    block.appendChild(criteriaWrap);

    // Escalation pathway
    block.appendChild(h('div', s({
      fontSize: 12,
      fontWeight: 600,
      color: B.navy,
      marginBottom: 6
    }), 'Escalation pathway:'));
    block.appendChild(h('div', s({
      fontSize: 13,
      color: B.navy,
      fontWeight: 500,
      padding: '8px 12px',
      background: B.blueLt,
      borderRadius: 8
    }), fu.escalation_pathway ||
      'Attending physio → Lifetime Health clinical team'));

    body.appendChild(block);
  }

  // Red flags + home advice
  const two = h('div', s({display:'grid', gridTemplateColumns:'1fr 1fr', gap:10, marginBottom:14}));
  [
    [p.red_flags||[], 'Red flags', B.red, '#7F1D1D', '#FEE2E2', '#FECACA', '▸'],
    [p.home_advice||[], 'Home advice', B.blue, '#1E2D5A', '#EEF2FF', '#DBEAFE', '✓']
  ].forEach(([items, label, hc, tc, bg, bc, icon]) => {
    const box = h('div', s({background:bg, borderRadius:10, padding:12, border:`1px solid ${bc}`}));
    box.appendChild(h('div', s({fontSize:11, fontWeight:600, color:hc, textTransform:'uppercase', letterSpacing:'0.7px', marginBottom:7}), label));
    items.forEach((item, i2) => {
      box.appendChild(h('div', s({fontSize:12, color:tc, padding:'3px 0', borderBottom:i2<items.length-1?`1px solid ${bc}`:'none', lineHeight:'1.4'}), icon+' '+item));
    });
    two.appendChild(box);
  });
  body.appendChild(two);

  // Action buttons
  const acts = h('div', {class:'no-print', style:{paddingBottom:24}});
  const row1 = h('div', s({display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:10, marginBottom:10}));
  const btn1 = h('button', {type:'button', style:{padding:'13px 0', borderRadius:10, border:`1px solid ${B.border}`, background:'white', color:B.navy, fontSize:14, fontWeight:500, cursor:'pointer'}}, 'New assessment');
  btn1.addEventListener('click', () => { state.plan = null; state.screen = 'select'; state.step = 0; render(); });
  const btn3 = h('button', {type:'button', style:{
    padding:'13px 0', borderRadius:10, border:'none',
    background:B.navy, color:'white',
    fontSize:14, fontWeight:600, cursor:'pointer',
    display:'flex', alignItems:'center', justifyContent:'center', gap:6
  }}, '↑ Save to Drive');
  btn3.addEventListener('click', async () => {
    btn3.textContent = 'Saving...';
    btn3.style.opacity = '0.7';
    btn3.style.cursor = 'default';
    try {
      const res = await fetch('/save-pdf', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          patient: {
            ...state.plan._form,
            painScore:  state.plan._form.painScore,
            pain_score: state.plan._form.painScore,
            condition:  state.plan._form.condition
          },
          plan: state.plan
        })
      });
      const data = await res.json();
      if (data.success) {
        btn3.textContent = '✓ Saved';
        btn3.style.background = B.blue;
        btn3.style.opacity = '1';
        const linkEl = h('div', s({
          position:'fixed', bottom:90, left:'50%',
          transform:'translateX(-50%)',
          background:B.navy2, color:'white',
          padding:'12px 18px', borderRadius:10,
          fontSize:13, zIndex:999,
          boxShadow:'0 4px 20px rgba(0,0,0,0.3)',
          display:'flex', alignItems:'center', gap:10,
          maxWidth:320, width:'90%'
        }),
          h('span', null, '✓ Saved to Drive'),
          h('a', {href:data.driveLink, target:'_blank', style:{color:'#7DB8F7', textDecoration:'none', fontWeight:600, marginLeft:'auto'}}, 'Open →')
        );
        document.body.appendChild(linkEl);
        setTimeout(() => linkEl.remove(), 6000);
      } else {
        throw new Error(data.error);
      }
    } catch (err) {
      btn3.textContent = '✗ Failed';
      btn3.style.background = B.red;
      btn3.style.opacity = '1';
      btn3.style.cursor = 'pointer';
      setTimeout(() => { btn3.textContent = '↑ Save to Drive'; btn3.style.background = B.navy; }, 3000);
    }
  });
  const btn2 = h('button', {type:'button', style:{padding:'13px 0', borderRadius:10, border:'none', background:B.blue, color:'white', fontSize:14, fontWeight:600, cursor:'pointer'}}, 'Edit & regenerate');
  btn2.addEventListener('click', () => { state.screen = 'form'; state.step = 0; render(); });
  row1.appendChild(btn1); row1.appendChild(btn3); row1.appendChild(btn2);
  const btnPdf = h('button', {type:'button', style:{padding:'13px 0', borderRadius:10, border:'none', background:B.blue, color:'white', fontSize:14, fontWeight:600, cursor:'pointer'}}, '⬇ Download PDF');
  btnPdf.addEventListener('click', async () => {
    btnPdf.textContent = 'Generating...';
    btnPdf.style.opacity = '0.7';
    try {
      const res = await fetch('/download-pdf', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          patient: {
            ...state.plan._form,
            painScore:  state.plan._form.painScore,
            pain_score: state.plan._form.painScore,
            condition:  state.plan._form.condition
          },
          plan: state.plan
        })
      });
      if (!res.ok) throw new Error('Generation failed');
      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      const name = (state.plan._form.name || 'Patient').replace(/\s+/g, '_');
      const cond = (state.plan._form.condition || 'Plan').replace(/[^a-zA-Z0-9]/g, '_').slice(0, 20);
      const date = new Date().toISOString().slice(0, 10);
      a.download = `${name}_${cond}_${date}.pdf`;
      a.click();
      URL.revokeObjectURL(url);
      btnPdf.textContent = '✓ Downloaded';
      setTimeout(() => { btnPdf.textContent = '⬇ Download PDF'; btnPdf.style.opacity = '1'; }, 2000);
    } catch (err) {
      btnPdf.textContent = '✗ Failed';
      btnPdf.style.background = '#DC2626';
      setTimeout(() => { btnPdf.textContent = '⬇ Download PDF'; btnPdf.style.background = ''; }, 3000);
    }
  });
  const row2 = h('div', s({display:'grid', gridTemplateColumns:'1fr 1fr', gap:10}));
  const btnWa = h('button', {type:'button', style:{padding:'13px 0', borderRadius:10, border:'none', background:'#25D366', color:'white', fontSize:14, fontWeight:600, cursor:'pointer'}}, '💬 WhatsApp');
  btnWa.addEventListener('click', () => {
    const text = buildWhatsAppText(p, f);
    window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank');
  });
  row2.appendChild(btnPdf); row2.appendChild(btnWa);
  acts.appendChild(row1); acts.appendChild(row2);
  body.appendChild(acts);

  wrap.appendChild(body);
  return wrap;
}

function renderServiceSelect() {
  const wrap = h('div', s({
    background: B.bg, minHeight: '100vh',
    display: 'flex', flexDirection: 'column'
  }));
  wrap.appendChild(renderHeader('Care Plan Generator — Beta v1'));

  const body = h('div', s({ padding: '36px 20px', flex: '1' }));
  body.appendChild(h('div', s({
    fontSize: 20, fontWeight: 700, color: B.navy,
    marginBottom: 6, textAlign: 'center'
  }), 'What are you creating today?'));
  body.appendChild(h('div', s({
    fontSize: 14, color: B.muted, marginBottom: 32,
    textAlign: 'center', lineHeight: '1.5'
  }), 'Select the service line for this patient'));

  const services = [
    { title: 'Physiotherapy', desc: 'Treatment plan with phases, exercises and recovery trajectory', url: null },
    { title: 'Caregiving',    desc: 'Daily care routine, monitoring and session record sheet',        url: '/caregiver' }
  ];

  const cards = h('div', s({
    display: 'flex', flexDirection: 'column', gap: 14,
    maxWidth: 420, margin: '0 auto'
  }));

  services.forEach(svc => {
    const card = h('button', { type: 'button', style: {
      display: 'flex', alignItems: 'center', gap: 14, width: '100%',
      padding: '20px 18px', textAlign: 'left', background: 'white',
      border: '1.5px solid ' + B.border, borderRadius: 12,
      cursor: 'pointer', transition: 'all 0.15s'
    }});
    const textCol = h('div', s({ flex: '1' }));
    textCol.appendChild(h('div', s({
      fontSize: 16, fontWeight: 700, color: B.navy, marginBottom: 4
    }), svc.title));
    textCol.appendChild(h('div', s({
      fontSize: 13, color: B.muted, lineHeight: '1.45'
    }), svc.desc));
    card.appendChild(textCol);
    card.appendChild(h('div', s({
      fontSize: 20, color: B.blue, flexShrink: 0
    }), '→'));

    card.addEventListener('mouseenter', () => {
      card.style.border = '1.5px solid ' + B.blue;
      card.style.background = B.blueLt;
    });
    card.addEventListener('mouseleave', () => {
      card.style.border = '1.5px solid ' + B.border;
      card.style.background = 'white';
    });
    card.addEventListener('click', () => {
      if (svc.url) window.location.href = svc.url;
      else { state.screen = 'form'; state.step = 0; render(); }
    });
    cards.appendChild(card);
  });

  body.appendChild(cards);
  wrap.appendChild(body);
  return wrap;
}

function renderForm() {
  const wrap = h('div', s({background:B.bg, minHeight:'100vh', display:'flex', flexDirection:'column'}));
  wrap.appendChild(renderHeader('Care Plan Generator — Beta v1'));
  wrap.appendChild(renderStepBar());

  const content = h('div', s({flex:1, paddingTop:8, paddingBottom:10}));
  const panel = {0:renderStep0, 1:renderStep1, 2:renderStep2}[state.step]?.();
  if (panel) { panel.classList.add('fade-up'); content.appendChild(panel); }
  wrap.appendChild(content);

  if (state.error) {
    wrap.appendChild(h('div', s({margin:'0 16px 8px', padding:10, borderRadius:8, background:B.redLt, color:B.red, fontSize:13}), state.error));
  }

  // Navigation bar
  const nav = h('div', {class:'no-print', style:{padding:'12px 16px', background:'white', borderTop:`1px solid ${B.border}`, display:'flex', gap:10, position:'sticky', bottom:0}});
  const isLast  = state.step === 2;
  const canNext =
    (state.step === 0 && state.form.name.trim().length > 0 && String(state.form.age).length > 0) ||
    (state.step === 1 && state.form.condition.length > 0) ||
    state.step === 2;

  if (state.step > 0) {
    const back = h('button', {type:'button', style:{flex:'1', padding:'13px 0', borderRadius:10, border:`1px solid ${B.border}`, background:'white', color:B.navy, fontSize:15, fontWeight:500, cursor:'pointer'}}, '← Back');
    back.addEventListener('click', () => { state.step--; render(); });
    nav.appendChild(back);
  } else {
    const services = h('button', {type:'button', style:{flex:'1', padding:'13px 0', borderRadius:10, border:`1px solid ${B.border}`, background:'white', color:B.navy, fontSize:15, fontWeight:500, cursor:'pointer'}}, '← Services');
    services.addEventListener('click', () => { state.screen = 'select'; render(); });
    nav.appendChild(services);
  }

  const fwd = h('button', {type:'button', id:'nav-fwd', style:{
    flex:'2', padding:'13px 0', borderRadius:10, border:'none',
    background: canNext ? (isLast ? B.blue : B.blue) : B.border,
    color: canNext ? 'white' : B.muted,
    fontSize:15, fontWeight:600, cursor: canNext ? 'pointer' : 'default'
  }}, isLast ? 'Generate plan →' : 'Next →');

  fwd.addEventListener('click', () => {
    const f = state.form;
    const enabled =
      (state.step === 0 && f.name.trim().length > 0 && String(f.age).length > 0) ||
      (state.step === 1 && f.condition.length > 0) ||
      state.step === 2;
    if (!enabled) return;
    if (isLast) generate(); else { state.step++; render(); }
  });
  nav.appendChild(fwd);
  wrap.appendChild(nav);
  return wrap;
}

/* ─────────────────────────────────────────────────────────────────
   RENDER LOOP
   ───────────────────────────────────────────────────────────────── */
function render() {
  const app = document.getElementById('app');
  app.innerHTML = '';
  let screen;
  if (state.screen === 'select') screen = renderServiceSelect();
  else if (state.screen === 'loading') screen = renderLoading();
  else if (state.screen === 'plan' && state.plan) screen = renderPlan();
  else screen = renderForm();
  app.appendChild(screen);
  window.scrollTo(0, 0);
}

render();
</script>
</body>
</html>
