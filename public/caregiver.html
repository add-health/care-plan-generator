/* Monitoring equipment is deliberately absent: BP apparatus, pulse oximeter,

/* ─────────────────────────────────────────────────────────────────

/* ─────────────────────────────────────────────────────────────────
   DOM HELPERS
   ───────────────────────────────────────────────────────────────── */
/* The CSS properties that legitimately take a bare number. Anything else given a
   number is a length: assigning it unitless produces invalid CSS and the browser
   drops the declaration silently, so applyStyle adds the px. Keep this list in sync
   with the copy in index.html. */
const UNITLESS_CSS = new Set([
  'animationIterationCount','aspectRatio','borderImageOutset','borderImageSlice','borderImageWidth',
  'columnCount','columns','flex','flexGrow','flexShrink','fontWeight','scale',
  'gridArea','gridColumn','gridColumnEnd','gridColumnStart','gridRow','gridRowEnd','gridRowStart',
  'lineClamp','lineHeight','opacity','order','orphans','tabSize','widows','zIndex','zoom',
  'fillOpacity','floodOpacity','stopOpacity','strokeDasharray','strokeDashoffset',
  'strokeMiterlimit','strokeOpacity','strokeWidth'
]);

function applyStyle(el, obj) {
  Object.entries(obj).forEach(([prop, val]) => {
    el.style[prop] = typeof val === 'number' && !UNITLESS_CSS.has(prop) ? val + 'px' : val;
  });
}

function h(tag, attrs, ...children) {
  const el = document.createElement(tag);
  if (attrs) Object.entries(attrs).forEach(([k,v]) => {
    if (k === 'style' && typeof v === 'object') applyStyle(el, v);
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2).toLowerCase(), v);
    else el.setAttribute(k, v);
  });
  children.flat().forEach(c => {
    if (c == null || c === false) return;
    el.appendChild(typeof c === 'string' || typeof c === 'number' ? document.createTextNode(c) : c);
  });
  return el;
}
const s = obj => ({ style: obj });

/* ─────────────────────────────────────────────────────────────────
   REUSABLE UI COMPONENTS
   ───────────────────────────────────────────────────────────────── */
function renderHeader(sub) {
  return h('div', s({background:'linear-gradient(135deg, #1A2744 0%, #1E2D5A 100%)', padding:'16px 20px 18px 20px', display:'flex', alignItems:'center', justifyContent:'space-between', borderBottom:'1px solid rgba(255,255,255,0.08)'}),
    h('div', null,
      h('div', s({color:'white', fontSize:16, fontWeight:700, letterSpacing:'0.2px'}), 'Lifetime Health'),
      sub ? h('div', s({color:'#7DB8F7', fontSize:13, marginTop:3}), sub) : null
    ),
    sub ? h('div', s({background:'rgba(255,255,255,0.1)', color:'#93C5FD', fontSize:10, fontWeight:600, padding:'4px 10px', borderRadius:20, letterSpacing:'0.8px'}), 'BETA') : null
  );
}

function renderStepBar() {
  const cur = state.step;
  const bar = h('div', s({background:B.white, padding:'12px 16px', borderBottom:`1px solid ${B.border}`, display:'flex', alignItems:'center'}));
  STEPS.forEach((name, i) => {
    const done = i < cur, active = i === cur;
    const circle = h('div', s({
      width:26, height:26, borderRadius:13, flexShrink:0,
      background: done?B.blue : active?B.blue : B.border,
      color: done||active ? 'white' : B.muted,
      fontSize:11, fontWeight:700, display:'flex', alignItems:'center', justifyContent:'center'
    }), done ? '✓' : String(i+1));
    const cell = h('div', s({display:'flex', alignItems:'center', flexShrink:0}), circle);
    // Five steps do not fit on a phone with every label shown, so only the current one is named
    if (active) cell.appendChild(h('span', s({fontSize:11, fontWeight:600, color:B.navy, marginLeft:10}), name));
    bar.appendChild(cell);
    if (i < STEPS.length - 1) {
      bar.appendChild(h('div', s({flex:1, height:1.5, background:done?B.blue:B.border, margin:'0 6px'})));
    }
  });
  return bar;
}

function renderLabel(text, required) {
  return h('div', s({fontSize:13, fontWeight:600, color:B.navy, marginBottom:10}),
    text, required ? h('span', s({color:B.red, marginLeft:2}), '*') : null
  );
}

function renderInput(val, onchange, placeholder, type='text') {
  const el = h('input', {type, placeholder, value:val, style:{
    width:'100%', padding:'14px 14px', borderRadius:8,
    border:`1px solid ${B.border}`, fontSize:16, color:B.text, background:'white'
  }});
  el.addEventListener('input', e => onchange(e.target.value));
  return el;
}

function renderSelect(val, onchange, options) {
  const el = h('select', s({
    width:'100%', padding:'14px 36px 14px 14px', borderRadius:8,
    border:`1px solid ${B.border}`, fontSize:15, background:'white',
    color:val ? B.text : B.muted
  }));
  const blank = document.createElement('option');
  blank.value = ''; blank.textContent = 'Select...'; el.appendChild(blank);
  options.forEach(o => {
    const opt = document.createElement('option');
    opt.value = o; opt.textContent = o;
    if (o === val) opt.selected = true;
    el.appendChild(opt);
  });
  el.addEventListener('change', e => onchange(e.target.value));
  return el;
}

function renderTextarea(val, onchange, placeholder, rows) {
  const el = h('textarea', {placeholder, rows, style:{
    width:'100%', padding:'10px 12px', borderRadius:8, border:`1px solid ${B.border}`,
    fontSize:14, resize:'none', color:B.text, lineHeight:'1.6'
  }}, val);
  el.addEventListener('input', e => onchange(e.target.value));
  return el;
}

function renderChips(options, key, toggle, label) {
  const wrap = h('div', s({marginBottom:24}));
  if (label) wrap.appendChild(renderLabel(label));
  const chips = h('div', s({display:'flex', flexWrap:'wrap', gap:7, marginTop:8}));
  options.forEach(o => {
    const sel = (state.form[key]||[]).includes(o);
    const chip = h('button', {type:'button', style:{
      padding:'7px 13px', borderRadius:20,
      border:`1.5px solid ${sel?B.blue:B.border}`,
      background:sel?B.blueLt:'white', color:sel?B.navy:B.muted,
      fontSize:13, fontWeight:sel?600:400, cursor:'pointer'
    }}, o);
    chip.addEventListener('click', () => {
      toggle(o);
      Array.from(chips.children).forEach(sibling => {
        const sibSel = (state.form[key]||[]).includes(sibling.textContent);
        sibling.style.border = `1.5px solid ${sibSel ? B.blue : B.border}`;
        sibling.style.background = sibSel ? B.blueLt : 'white';
        sibling.style.color = sibSel ? B.navy : B.muted;
        sibling.style.fontWeight = sibSel ? '600' : '400';
      });
    });
    chips.appendChild(chip);
  });
  wrap.appendChild(chips);
  return wrap;
}

function renderRadio(options, selected, onChange, label) {
  const wrap = h('div', s({marginBottom:24}));
  if (label) wrap.appendChild(renderLabel(label));
  const group = h('div', s({display:'flex', flexWrap:'wrap', gap:7, marginTop:8}));
  options.forEach(o => {
    const sel = selected === o;
    const btn = h('button', {type:'button', style:{
      padding:'8px 13px', borderRadius:8,
      border:`1.5px solid ${sel?B.blue:B.border}`,
      background:sel?B.blue:'white', color:sel?'white':B.text,
      fontSize:13, fontWeight:sel?600:400, cursor:'pointer'
    }}, o);
    btn.addEventListener('click', () => {
      onChange(o);
      Array.from(group.children).forEach(sibling => {
        const sibSel = sibling.textContent === o;
        sibling.style.border = `1.5px solid ${sibSel ? B.blue : B.border}`;
        sibling.style.background = sibSel ? B.blue : 'white';
        sibling.style.color = sibSel ? 'white' : B.text;
        sibling.style.fontWeight = sibSel ? '600' : '400';
      });
    });
    group.appendChild(btn);
  });
  wrap.appendChild(group);
  return wrap;
}

function renderField(label, control, required) {
  const wrap = h('div', s({marginBottom:28}));
  wrap.appendChild(renderLabel(label, required));
  wrap.appendChild(control);
  return wrap;
}

function renderSectionHead(title, subtitle) {
  const box = h('div', null);
  box.appendChild(h('div', s({fontSize:16, fontWeight:600, color:B.navy, marginBottom:10, marginTop:4}), title));
  box.appendChild(h('div', s({fontSize:13, color:B.muted, marginBottom:28}), subtitle));
  return box;
}

/* ─────────────────────────────────────────────────────────────────
   FORM STEPS
   ───────────────────────────────────────────────────────────────── */
function upd(k, v) { state.form = {...state.form, [k]:v}; }

// Multi-select toggle where one option clears all the others, e.g. 'None' or 'Continent'
function togEx(k, v, exclusive) {
  const arr = state.form[k] || [];
  if (v === exclusive) { state.form[k] = [exclusive]; return; }
  const filtered = arr.filter(x => x !== exclusive);
  state.form[k] = filtered.includes(v)
    ? filtered.filter(x => x !== v)
    : [...filtered, v];
}

function tog(k, v) { togEx(k, v, 'None'); }

function canProceed(step) {
  const f = state.form;
  if (step === 0) return f.name.trim().length > 0 && f.serviceTier.length > 0;
  if (step === 1) return f.careType.length > 0;
  return true;
}

// Update just the nav button appearance without a full re-render (avoids losing input focus)
function patchNavBtn() {
  const btn = document.getElementById('nav-fwd');
  if (!btn) return;
  const ok = canProceed(state.step);
  btn.style.background = ok ? B.blue : B.border;
  btn.style.color = ok ? 'white' : B.muted;
  btn.style.cursor = ok ? 'pointer' : 'default';
}

function renderStep0() {
  const f = state.form;
  const sec = h('div', {class:'form-section', style:{padding:'28px 20px 20px 20px'}});
  sec.appendChild(renderSectionHead('Patient details', 'Who the care plan is for and which service they have booked'));

  sec.appendChild(renderField('Patient name',
    renderInput(f.name, v => { upd('name', v); patchNavBtn(); }, 'e.g. Meena Sharma'), true));

  const grid = h('div', s({display:'grid', gridTemplateColumns:'1fr 1fr', gap:20, marginBottom:28}));
  grid.appendChild(renderField('Age', renderInput(f.age, v => upd('age', v), 'e.g. 72', 'number')));
  grid.appendChild(renderField('Gender', renderSelect(f.gender, v => upd('gender', v), ['Female','Male','Other'])));
  sec.appendChild(grid);

  sec.appendChild(renderField('Zone / Branch', renderSelect(f.zone, v => upd('zone', v), ZONES)));

  // Only clock-mode tiers anchor the routine to the day, so only they ask for a start
  const shiftW = renderField('Shift start time',
    renderInput(f.shiftStart, v => upd('shiftStart', v), '', 'time'));
  const applyShiftVis = () => {
    shiftW.style.display = tierCfg().timeMode === 'clock' ? 'block' : 'none';
  };

  sec.appendChild(renderField('Service tier',
    renderSelect(f.serviceTier, v => {
      upd('serviceTier', v);
      applyShiftVis();
      patchNavBtn();
    }, SERVICE_TIERS), true));
  sec.appendChild(shiftW);
  applyShiftVis();

  sec.appendChild(renderField('Care start date', renderInput(f.startDate, v => upd('startDate', v), '', 'date')));
  sec.appendChild(renderField('Assessed by', renderInput(f.assessedBy, v => upd('assessedBy', v), 'Senior nurse or assessor name')));
  return sec;
}

function renderStep1() {
  const f = state.form;
  const sec = h('div', {class:'form-section', style:{padding:'28px 20px 20px 20px'}});
  sec.appendChild(renderSectionHead('Background', 'Care archetype loads automatically on selection'));

  const proto = CARE_PROTOCOLS.find(p => p.care_type === f.careType);
  const hint = h('div', s({marginTop:8, padding:'9px 12px', borderRadius:8, background:B.blueLt, fontSize:13, color:B.navy, display:proto?'block':'none'}));
  if (proto) hint.textContent = proto.overview;

  const surgeryW = renderField('Date of surgery or hospital discharge',

/* The package includes a number of kits per SESSION, not one of each type.
   Units are charged against that allowance in a stable order — the mandatory
   disposable kit first, then KITS order — so the same selection always bills
   the same way, and a kit's own pill depends on what else is selected.
   One calculation, used by the cards, the summary bar and the plan JSON. */
function kitBilling(kitsObj, allowance) {
  const kits = kitsObj || {};
  const order = [DISPOSABLE_KIT].concat(
    KITS.map(k => k.name).filter(n => n !== DISPOSABLE_KIT));
  let remaining = Math.max(0, allowance);
  let total = 0;
  const perKit = {};

  order.filter(n => kits[n] != null).forEach(name => {
    const qty = kits[name];
    total += qty;
    const covered = Math.max(0, Math.min(qty, remaining));
    remaining -= covered;
    const chargeable = qty - covered;
    perKit[name] = {
      qty, covered, chargeable,
      label: chargeable === 0 ? 'Included'
           : covered === 0    ? `${chargeable} chargeable`
           : `${covered} included, ${chargeable} chargeable`
    };
  });

  return {
    total,
    allowance,
    included: Math.min(total, allowance),
    extra: Math.max(0, total - allowance),
    perKit
  };
}

/* ─────────────────────────────────────────────────────────────────
   SUPPLY SUGGESTIONS
   Reads the assessment so a nurse is less likely to arrive without
   something. Advisory only — every line stays editable on step 5.
   ───────────────────────────────────────────────────────────────── */
function suggestSupplies() {
  const f = state.form;
  const kits = { 'Disposable kit': 1 };
  const cons = [];

  if (['Full assistance','Bed bath only'].includes(f.bathing)) {
    kits['Bathing kit'] = 1;
    kits['Grooming kit'] = 1;
  }
  if ((f.continence || []).includes('Uses diaper')) {
    kits['Diaper kit (L/XL/M)'] = 1;
    cons.push('Under pad');
  }
  if ((f.continence || []).includes('Colostomy')) {
    kits['Colostomy kit'] = 1;
  }
  if (f.feeding === 'NG tube (Ryles)') {
    kits['Ryles tube feed kit'] = 1;
  }
  if (f.wounds && f.wounds !== 'None') {
    kits['Small dressing kit'] = 1;
    cons.push('Betadine solution', 'Dressing set with forceps',
              'Sterile gloves', 'Normal saline 100ml');
  }
  if (f.skin === 'Pressure sore present') cons.push('Under pad');
  if ((f.vitals || []).includes('Blood sugar')) cons.push('Alcohol swab');

  return { kits, consumables: [...new Set(cons)] };
}

/* Step index 4. Named for the step number the team sees, not the array index. */
function renderStep5() {
  // Re-seed on every visit until the nurse edits something, so the suggestion keeps
  // up with an assessment that changed after this step was first opened. Once it has
  // been touched it is theirs, and nothing here writes to it again.
  if (!state.suppliesTouched) {
    const sug = suggestSupplies();
    state.form = {...state.form, kits: sug.kits, consumables: sug.consumables};
  }
  // Mandatory regardless of how the form got here — including plans started
  // before the kit became compulsory
  if ((state.form.kits || {})[DISPOSABLE_KIT] == null) {
    state.form = {...state.form, kits: {...(state.form.kits || {}), [DISPOSABLE_KIT]: 1}};
  }

  const f = state.form;
  const sec = h('div', {class:'form-section', style:{padding:'28px 20px 20px 20px'}});
  sec.appendChild(renderSectionHead('Supplies and contacts', 'What the nurse needs to bring and what is already at home'));

  sec.appendChild(renderChips(EQUIPMENT, 'equipment', v => tog('equipment', v),
    "Equipment already in the patient's home"));

  /* ── Kits ─────────────────────────────────────────────────────── */
  const kitsBlock = h('div', s({paddingTop:20, borderTop:`1px solid ${B.border}`}));
  if (!state.suppliesTouched) {
    kitsBlock.appendChild(h('div', s({fontSize:12, color:B.muted, marginBottom:10}),
      'Pre-selected from the assessment — review and adjust.'));
  }
  const allowance = tierCfg().kitAllowance;
  kitsBlock.appendChild(h('div', s({fontSize:13, fontWeight:600, color:B.navy}), 'Kits required'));
  kitsBlock.appendChild(h('div', s({fontSize:12, color:B.muted, marginBottom:14, lineHeight:'1.45'}),
    `Your package includes ${allowance} kits per session. The disposable kit is always one of them. Additional kits are charged separately.`));

  const summary = h('div', s({
    padding:'10px 14px', borderRadius:8, background:B.bg,
    border:`1px solid ${B.border}`, marginTop:4, fontSize:13
  }));

  // Every card's pill depends on the whole selection, so a change repaints all of them
  const painters = [];
  function repaintAll() { painters.forEach(p => p()); paintSummary(); }

  function paintSummary() {
    const b = kitBilling(state.form.kits, allowance);
    summary.textContent = '';
    summary.appendChild(document.createTextNode(
      `${b.total} kits · ${b.allowance} included · `));
    summary.appendChild(h('span', s({
      fontWeight: b.extra > 0 ? 700 : 400,
      color: b.extra > 0 ? '#92400E' : B.muted
    }), `${b.extra} chargeable`));
    if (!state.suppliesTouched && b.extra > 0) {
      summary.appendChild(h('div', s({fontSize:11.5, color:'#92400E', marginTop:6, lineHeight:'1.4'}),
        `The assessment alone suggests ${b.total} kits, which is ${b.extra} over the ${b.allowance} included. Review before confirming.`));
    }
  }

  KITS.forEach(kit => {
    const mandatory = kit.name === DISPOSABLE_KIT;
    const card = h('div', s({padding:'12px 14px', borderRadius:10, marginBottom:10, cursor:'pointer'}));

    const top = h('div', s({display:'flex', justifyContent:'space-between', alignItems:'flex-start', gap:10}));
    const nameEl = h('div', s({fontSize:14, fontWeight:600}), kit.name);
    const addEl = h('div', s({fontSize:13, color:B.blue, fontWeight:600, flexShrink:0}), '+ Add');
    top.appendChild(nameEl);
    top.appendChild(addEl);
    card.appendChild(top);
    card.appendChild(h('div', s({fontSize:12, color:B.muted, lineHeight:'1.45', marginTop:4}), kit.purpose));

    const stepBtn = label => h('button', {type:'button', style:{
      width:30, height:30, borderRadius:15, border:`1px solid ${B.border}`,
      background:'white', color:B.navy, fontSize:18, lineHeight:'1',
      display:'flex', alignItems:'center', justifyContent:'center',
      flexShrink:0, padding:0, cursor:'pointer'
    }}, label);

    const minus = stepBtn('−');
    const plus  = stepBtn('+');
    const qtyEl = h('div', s({fontSize:15, fontWeight:700, color:B.navy, minWidth:20, textAlign:'center'}));
    const lock  = h('div', s({fontSize:11, color:B.muted}), 'Always included');
    const tag   = h('div', s({marginLeft:'auto'}));
    const qtyRow = h('div', s({marginTop:12, display:'flex', alignItems:'center', gap:12}),
      minus, qtyEl, plus, lock, tag);
    card.appendChild(qtyRow);

    // The pill depends on the whole selection, so this is called for every card
    // on any change rather than only for the one that was touched
    function paint() {
      const qty = (state.form.kits || {})[kit.name];
      const sel = qty != null;
      card.style.border = `1.5px solid ${sel ? B.blue : B.border}`;
      card.style.background = sel ? B.blueLt : 'white';
      nameEl.style.color = sel ? B.navy : B.text;
      addEl.style.display = sel ? 'none' : 'block';
      card.style.cursor = mandatory && sel ? 'default' : 'pointer';
      qtyRow.style.display = sel ? 'flex' : 'none';
      if (sel) {
        qtyEl.textContent = String(qty);
        // The disposable kit cannot be removed, so at one it has no minus to press
        const atFloor = mandatory && qty <= 1;
        minus.style.display = atFloor ? 'none' : 'flex';
        lock.style.display  = atFloor ? 'block' : 'none';
        const bill = kitBilling(state.form.kits, allowance).perKit[kit.name];
        const chargeable = bill && bill.chargeable > 0;
        tag.textContent = '';
        tag.appendChild(h('span', s({
          fontSize:11, fontWeight:600,
          color: chargeable ? '#92400E' : '#166534',
          background: chargeable ? '#FEF3C7' : '#DCFCE7',
          padding:'4px 10px', borderRadius:20
        }), bill ? bill.label : 'Included'));
      }
    }
    painters.push(paint);

    function setQty(n) {
      const kits = {...(state.form.kits || {})};
      if (n == null) delete kits[kit.name]; else kits[kit.name] = n;
      state.form = {...state.form, kits};
      state.suppliesTouched = true;
      repaintAll();
    }

    card.addEventListener('click', () => {
      if ((state.form.kits || {})[kit.name] == null) setQty(1);
    });
    minus.addEventListener('click', e => {
      e.stopPropagation();
      const qty = (state.form.kits || {})[kit.name];
      if (qty == null) return;
      if (mandatory && qty <= 1) return;   // the disposable kit stays
      setQty(qty <= 1 ? null : qty - 1);   // stepping below one removes the kit
    });
    plus.addEventListener('click', e => {
      e.stopPropagation();
      const qty = (state.form.kits || {})[kit.name] || 0;
      setQty(Math.min(MAX_KIT_QTY, qty + 1));
    });

    kitsBlock.appendChild(card);
  });
  repaintAll();

  kitsBlock.appendChild(summary);
  sec.appendChild(kitsBlock);

  /* ── Consumables and contacts ─────────────────────────────────── */
  sec.appendChild(renderChips(CONSUMABLES, 'consumables', v => {
    tog('consumables', v);
    state.suppliesTouched = true;
  }, 'Consumables required'));
  sec.appendChild(renderField('Additional supplies or quantity changes',
    renderTextarea(f.supplyNotes, v => upd('supplyNotes', v),
      'Anything not listed above, or different quantities needed for this patient', 2)));

  const emergencyGrid = h('div', s({display:'grid', gridTemplateColumns:'1fr 1fr', gap:20, marginBottom:28}));
  emergencyGrid.appendChild(renderField('Emergency contact name', renderInput(f.emergencyName, v => upd('emergencyName', v), 'e.g. Ravi Sharma')));
  emergencyGrid.appendChild(renderField('Emergency contact phone', renderInput(f.emergencyPhone, v => upd('emergencyPhone', v), '9876543210', 'tel')));
  sec.appendChild(emergencyGrid);

  const doctorGrid = h('div', s({display:'grid', gridTemplateColumns:'1fr 1fr', gap:20, marginBottom:28}));
  doctorGrid.appendChild(renderField('Attending doctor', renderInput(f.doctorName, v => upd('doctorName', v), 'e.g. Dr Nair')));
  doctorGrid.appendChild(renderField("Doctor's phone", renderInput(f.doctorPhone, v => upd('doctorPhone', v), '9876543210', 'tel')));
  sec.appendChild(doctorGrid);

  sec.appendChild(renderField('Family notes and preferences',
    renderTextarea(f.familyNotes, v => upd('familyNotes', v), 'Anything the family wants us to know — routines, preferences, things that upset or comfort the patient', 3)));
  return sec;
}

function renderForm() {

  if (panel) { panel.classList.add('fade-up'); content.appendChild(panel); }
  wrap.appendChild(content);

  if (state.error) {
    wrap.appendChild(h('div', s({margin:'0 16px 8px', padding:10, borderRadius:8, background:B.redLt, color:B.red, fontSize:13}), state.error));
  }
  if (state.notice) {
    wrap.appendChild(h('div', s({margin:'0 16px 8px', padding:10, borderRadius:8, background:B.blueLt, color:B.navy, fontSize:13}), state.notice));
  }

  // Navigation bar
  const nav = h('div', {class:'no-print', style:{padding:'12px 16px', background:'white', borderTop:`1px solid ${B.border}`, display:'flex', gap:10, position:'sticky', bottom:0}});
  const isLast  = state.step === LAST_STEP;
  const canNext = canProceed(state.step);

  if (state.step > 0) {
    const back = h('button', {type:'button', style:{flex:'1', padding:'13px 0', borderRadius:10, border:`1px solid ${B.border}`, background:'white', color:B.navy, fontSize:15, fontWeight:500, cursor:'pointer'}}, '← Back');
    back.addEventListener('click', () => { state.step--; render(); });
    nav.appendChild(back);
  } else {
    const services = h('button', {type:'button', style:{flex:'1', padding:'13px 0', borderRadius:10, border:`1px solid ${B.border}`, background:'white', color:B.navy, fontSize:15, fontWeight:500, cursor:'pointer'}}, '← Services');
    services.addEventListener('click', () => { window.location.href = '/'; });
    nav.appendChild(services);
  }

  const fwd = h('button', {type:'button', id:'nav-fwd', style:{
    flex:'2', padding:'13px 0', borderRadius:10, border:'none',
    background: canNext ? B.blue : B.border,
    color: canNext ? 'white' : B.muted,
    fontSize:15, fontWeight:600, cursor: canNext ? 'pointer' : 'default'
  }}, isLast ? 'Generate care plan →' : 'Next →');

  fwd.addEventListener('click', () => {
    if (!canProceed(state.step)) return;
    if (isLast) generate(); else { state.step++; state.notice = ''; render(); }
  });
  nav.appendChild(fwd);
  wrap.appendChild(nav);
  return wrap;
}

/* ─────────────────────────────────────────────────────────────────
   GENERATION
   Claude writes the narrative — the routine, the explanations, the
   monitoring thresholds, the safety and contact advice. Everything the
   nurse already recorded (exercise, kits, consumables, which vitals) is
   filled in from the form instead of being asked for again: having a
   model retype structured data it was just handed is a chance to get it
   wrong for no benefit.
   ───────────────────────────────────────────────────────────────── */
const API_ENDPOINT = '/generate-plan';

// Roughly how many visits the record sheet should be ruled for
const TIER_SESSIONS = {
  'Basic — 2 hours': 12, 'Medium — 4 hours': 12, 'Advanced — 8 hours': 10,
  'Max — 12 hours': 10, 'Max+ — 24 hours': 8, 'Bathing assistance only': 15
};

// How many parts of the day the routine should be split into
const TIER_BLOCKS = {
  'Basic — 2 hours': 1, 'Medium — 4 hours': 2, 'Advanced — 8 hours': 4,
  'Max — 12 hours': 4, 'Max+ — 24 hours': 5, 'Bathing assistance only': 1
};

/* A conditional field hides when its controlling answer changes, but keeps its
   value so the nurse can toggle back without losing her typing. That means the
   form can hold answers the assessment no longer makes — exercise instructions
   after rest was advised, a wound location after wounds went back to None.
   Everything that leaves this app goes through here first, so the guarantee
   lives in one place instead of in a check at every read site. state.form is
   deliberately not modified. */
function sanitisedForm() {
  const f = { ...state.form };
  if (f.careType !== 'Post-surgical recovery') f.surgeryDate = '';
  if (!f.wounds || f.wounds === 'None')        f.woundLocation = '';
  if ((f.exerciseTypes || []).includes(NO_EXERCISE)) {
    f.exerciseFrequency = '';
    f.exerciseNotes = '';
  }

  // Half-typed rows are noise; drop any where nothing was entered at all
  f.medications = (f.medications || []).filter(m =>
    (m.time || '').trim() || (m.name || '').trim() || (m.dosage || '').trim());
  if (f.medication !== 'Yes') f.medications = [];

  // A tier that has no medication or exercise section must not smuggle values
  // recorded before the tier was changed
  const cfg = TIER_CONFIG[f.serviceTier] || {};
  if (cfg.sections && !cfg.sections.medication) {
    f.medication = 'No'; f.medications = [];
  }
  if (cfg.sections && !cfg.sections.exercise) {
    f.exerciseTypes = []; f.exerciseFrequency = ''; f.exerciseNotes = '';
  }
  if (cfg.timeMode !== 'clock') f.shiftStart = '';
  return f;
}

function buildSupplies(f) {
  const allowance = tierCfg(f.serviceTier).kitAllowance;
  const bill = kitBilling(f.kits, allowance);
  // Emit the split alongside the rows so the PDF prints these figures rather
  // than recomputing them and risking a different answer on the same plan
  const kits = Object.keys(bill.perKit).map(name => {
    const k = KITS.find(x => x.name === name);
    return {
      name,
      quantity: bill.perKit[name].qty,
      purpose: k ? k.purpose : '',
      billing: bill.perKit[name].label
    };
  });
  return {
    kits,
    consumables: [...(f.consumables || [])],
    kit_allowance: bill.allowance,
    kits_total: bill.total,
    kits_included: bill.included,
    kits_chargeable: bill.extra
  };
}

/* The assessor's rows are the source of truth for time, name and dosage. The
   prompt asks the model to copy them verbatim, but a medicine schedule is not
   something to leave to instruction-following — so only the plain-language
   "note" is taken from the model, matched back by position. */
function buildMedications(f, fromModel) {
  const rows = f.medications || [];
  const modelRows = Array.isArray(fromModel) ? fromModel : [];
  return rows.map((row, i) => {
    const m = modelRows[i] || {};
    const sameMedicine = (m.name || '').trim() === (row.name || '').trim();
    return {
      time:   row.time   || '',
      name:   row.name   || '',
      dosage: row.dosage || '',
      // Only keep a note that was written against this same medicine
      note:   sameMedicine && typeof m.note === 'string' ? m.note : ''
    };
  });
}

function buildExercise(f, precautions) {
  return {
    types: [...(f.exerciseTypes || [])],
    frequency: f.exerciseFrequency || '',
    instructions: f.exerciseNotes || '',
    precautions: precautions || ''
  };
}

async function generate() {
  const f = sanitisedForm();
  const proto = CARE_PROTOCOLS.find(p => p.care_type === f.careType);
  if (!proto) { state.error = 'Please choose the type of care needed first'; render(); return; }

  state.screen = 'loading'; state.error = ''; state.notice = ''; render();

  const cfg = tierCfg(f.serviceTier);
  const sec = cfg.sections;
  const vitals = (f.vitals || []).length ? f.vitals : ['Blood pressure', 'Pulse', 'Temperature'];
  const restAdvised = (f.exerciseTypes || []).includes(NO_EXERCISE);
  const meds = f.medications || [];
  const turning2h = f.mobility === 'Bedbound';

  // Short services get at most two blocks; otherwise fall back to the per-tier count
  const blocks = sec.routine === 'short'
    ? Math.min(2, TIER_BLOCKS[f.serviceTier] || 2)
    : (TIER_BLOCKS[f.serviceTier] || 3);

  const timeRule = cfg.timeMode === 'relative' ? `
TIME FORMAT — RELATIVE. This service can be delivered at any time of day. Do NOT use clock times
anywhere in daily_routine. Use elapsed time from the start of the visit. Set "block" to a short
sequence name ("On arrival", "First hour", "Second hour", "Before leaving") and "time_range" to
elapsed minutes ("0–20 min", "20–60 min"). Set each task's "time" to elapsed time ("0:00", "0:20").
The total elapsed time across all blocks must not exceed ${cfg.hours} hour${cfg.hours === 1 ? '' : 's'}.` : `
TIME FORMAT — CLOCK. This is a ${cfg.hours}-hour service starting at ${f.shiftStart || '08:00'}.
Meals, medicines and sleep are anchored to the day, so use real clock times. Derive every time in
daily_routine from the shift start, running forward for ${cfg.hours} hours and wrapping past
midnight where needed (a shift from 20:00 runs into the following morning). Write times in a form
the family reads easily ("8:00 am", "1:30 pm"). Do not schedule anything outside the shift.`;

  const restRule = cfg.staffRestHours > 0 ? `
STAFF REST — MANDATORY. This is a ${cfg.hours}-hour service and the nurse must have
${cfg.staffRestHours} hours of rest. Include a block in daily_routine with
"block": "${REST_BLOCK}" covering ${cfg.staffRestHours} continuous hours. For 24-hour care place it
overnight, when the patient is asleep and needs least active care. Its "tasks" must state, in plain
language addressed to the patient and family: what care continues during this period (the nurse
remains in the home and is woken for emergencies), what the family should do if the patient needs
help, and how to wake the nurse. Never schedule scheduled tasks — medication, feeds, exercises —
inside this block.${turning2h ? `
This patient is bedbound. If 2-hourly turning is clinically required it must continue through the
rest period: say so explicitly, shorten the rest block accordingly, and set "staffing_note" to a
plain-language warning that a family member or a second nurse must carry out the overnight turns.` : ''}` : '';

  const medRule = !sec.medication ? `
MEDICATION. This is a single-task service. Do NOT include medication in the plan. Omit the
medications array entirely.` : (meds.length ? `
MEDICATION — the medications array below was recorded by the assessor. Copy it into your output
EXACTLY as given. Do not reword, reformat, correct spelling, convert dosages, add medicines, or
remove any. If a time reads 'after breakfast', keep it. Add a brief plain-language "note" per
medicine ONLY where there is a clear administration point the family should know, such as taking it
with food. If unsure, leave note empty.
Schema: "medications": [{ "time": "", "name": "", "dosage": "", "note": "" }]` : `
MEDICATION. No medicines were recorded. Omit the medications array entirely.`);

  const exerciseRule = !sec.exercise ? `
EXERCISE. This is a single-task service. Do NOT include an exercise plan and do not mention
exercises in the routine.` : '';

  const monitoringRule = sec.monitoring === 'minimal' ? `
- monitoring: include ONLY the vitals the assessor selected, and no more than two rows total.` : `
- monitoring: one row for each of these measures and no others: ${vitals.join(', ')}.
  normal_range and call_if must be real clinical thresholds appropriate to this patient's age and
  conditions. call_if is what makes the family pick up the phone, so be specific and numeric.`;

  const systemPrompt = `You are a senior nurse at Lifetime Health, Bangalore, writing a home care plan.

WHO READS THIS. The patient and their family. It is printed and kept in the patient's home, so a
replacement nurse also reads it — but it is written FOR the patient, not for staff.

TONE RULES — these are not optional:
- Address the patient directly as "you" and "your".
- Say "your nurse". Never say "caregiver", "staff", "attendant", or "the patient".
- Plain English. No clinical shorthand, no abbreviations the family would not know. Write
  "pressure sore" not "decubitus ulcer", "breathing trouble" not "respiratory distress".
- Explain the reason for things, calmly. Do not frighten, and do not be vague either.
- Indian English spelling and idiom. Rupee amounts never appear in this document.

CRITICAL: Respond ONLY with valid JSON. No markdown code fences. No commentary. Pure JSON.

Produce exactly this shape:
{
  "care_summary": "2-3 sentences addressed to the patient, saying what care they are getting and why",
  "daily_routine": [
    {
      "block": "Morning",
      "time_range": "7:00 - 10:00 am",
      "tasks": [
        { "time": "7:00 am", "task": "Short task name", "note": "One sentence saying what happens and any detail that matters" }
      ]
    }
  ],
  "care_explained": [
    { "task": "Task name", "why": "2-3 sentences on what goes wrong without it", "how": "1-2 sentences on what your nurse actually does" }
  ],
  "monitoring": [
    { "measure": "Blood pressure", "when": "Morning and afternoon", "normal_range": "Below 140/90", "call_if": "Above 160/100 or below 90/60" }
  ],
  "safety_at_home": ["plain-language safety point", "..."],
  "contact_criteria": ["Call your nurse if ...", "..."],
  "exercise_precautions": "what to stop for, one or two sentences",
  "medications": [{ "time": "", "name": "", "dosage": "", "note": "" }],
  "staffing_note": "",
  "session_count": 10
}
${timeRule}
${restRule}
${medRule}
${exerciseRule}

RULES:
- daily_routine must contain at most ${blocks} block${blocks === 1 ? '' : 's'}, matching a
  ${f.serviceTier || 'standard'} engagement. Each block gets 4 to 5 tasks, in order, not overlapping
  between blocks.${cfg.staffRestHours > 0 ? ` The rest block is additional to these.` : ''}
- care_explained: 5 to 6 items, drawn from the core tasks of this care type and from what the
  assessment below actually shows. This is the section a replacement nurse relies on, so the "why"
  must give the real reason, not a platitude.${monitoringRule}
- safety_at_home: exactly 5 items, specific to this patient's mobility, equipment and home risks.
- contact_criteria: exactly 5 items, each starting with "Call".
- staffing_note: leave as an empty string unless a real staffing constraint applies.
- exercise_precautions: ${restAdvised
    ? 'rest has been advised, so return an empty string for this field.'
    : 'what would make your nurse stop the exercises for this particular patient.'}
- session_count: a whole number between 6 and 15 for how many visits the record sheet should be
  ruled for, based on this care type and service tier.
- Never name an individual clinician. Never promise a cure or a timeline you cannot support.
- If the assessment shows a wound, a tube, a catheter or a colostomy, the routine and the
  explanations must both cover it.

CARE ARCHETYPE — use this as the clinical backbone, adapted to the assessment:
${JSON.stringify(proto, null, 2)}`;

  const userMessage = `PATIENT ASSESSMENT

Name: ${f.name || 'Patient'} | Age: ${f.age || 'not recorded'} | Gender: ${f.gender} | Zone: ${f.zone}
Care type: ${f.careType}
Service tier: ${f.serviceTier} (${cfg.hours} hour${cfg.hours === 1 ? '' : 's'} per session)
Care starts: ${f.startDate || 'not recorded'}${cfg.timeMode === 'clock' ? `\nShift starts at: ${f.shiftStart || '08:00'}` : ''}
Assessed by: ${f.assessedBy || 'not recorded'}
${f.careType === 'Post-surgical recovery' ? `Surgery or discharge date: ${f.surgeryDate || 'not recorded'}\n` : ''}
Medical conditions: ${(f.conditions || []).length ? f.conditions.join(', ') : 'None recorded'}${(f.conditions || []).includes('Other') && f.conditionsOther ? ` (other: ${f.conditionsOther})` : ''}
Allergies: ${f.allergies || 'None recorded'}

DEPENDENCY
Mobility: ${f.mobility}
Transfers: ${f.transfers}
Bathing: ${f.bathing}
Continence: ${(f.continence || []).length ? f.continence.join(', ') : 'not recorded'}
Feeding: ${f.feeding}
Awareness and communication: ${f.cognition}
Skin: ${f.skin}
Wounds: ${f.wounds}${f.wounds !== 'None' && f.woundLocation ? ` at ${f.woundLocation}` : ''}

DAILY NEEDS
Fall risk: ${f.fallRisk}
Vitals to monitor: ${vitals.join(', ')}
Medication support: ${f.medication}
${meds.length ? `MEDICATIONS RECORDED BY THE ASSESSOR — copy these verbatim:\n${JSON.stringify(meds, null, 2)}` : 'Medicines recorded: none'}
Exercise: ${(f.exerciseTypes || []).length ? f.exerciseTypes.join(', ') : 'none recorded'}${f.exerciseFrequency ? `, ${f.exerciseFrequency}` : ''}
Exercise instructions from the assessor: ${f.exerciseNotes || 'none'}
Equipment already at home: ${(f.equipment || []).length ? f.equipment.join(', ') : 'none recorded'}
Family notes: ${f.familyNotes || 'none'}

Today's date: ${new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' })}

Write the care plan as JSON:`;

  try {
    const res = await fetch(API_ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ system: systemPrompt, messages: [{ role: 'user', content: userMessage }] })
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error || `Server error ${res.status}`);
    }

    const data = await res.json();
    const text = data.content?.find(b => b.type === 'text')?.text || '';
    const clean = text.replace(/```json\n?/g, '').replace(/```\n?/g, '').trim();
    const parsed = JSON.parse(clean);

    // Clamp to the same 6-15 range the prompt asks for, so a stray value cannot
    // silently produce a record sheet nobody expected. 15 also keeps it to one page.
    const sessions = Math.min(15, Math.max(6,
      parseInt(parsed.session_count, 10) || TIER_SESSIONS[f.serviceTier] || 10));

    state.plan = {
      care_summary:        parsed.care_summary || '',
      service_tier:        f.serviceTier,
      time_mode:           cfg.timeMode,
      shift_start:         cfg.timeMode === 'clock' ? (f.shiftStart || '08:00') : '',
      daily_routine:       parsed.daily_routine || [],
      care_explained:      parsed.care_explained || [],
      medications:         buildMedications(f, parsed.medications),
      exercise_plan:       sec.exercise ? buildExercise(f, parsed.exercise_precautions) : null,
      monitoring:          parsed.monitoring || [],
      safety_at_home:      parsed.safety_at_home || [],
      contact_criteria:    parsed.contact_criteria || [],
      escalation_pathway:  'Attending nurse → Lifetime Health clinical team',
      staffing_note:       typeof parsed.staffing_note === 'string' ? parsed.staffing_note : '',
      supplies:            buildSupplies(f),
      // Patient data, never routed through the model
      contacts: {
        emergency_name:  f.emergencyName  || '',
        emergency_phone: f.emergencyPhone || '',
        doctor_name:     f.doctorName     || '',
        doctor_phone:    f.doctorPhone    || ''
      },
      session_count:       sessions,
      _form:               f,
      _generatedAt:        new Date().toLocaleString('en-IN', {
                             day: 'numeric', month: 'short', year: 'numeric',
                             hour: '2-digit', minute: '2-digit'
                           })
    };
    state.screen = 'plan';

  } catch (err) {
    console.error('Generation error:', err);
    state.error = err.message || 'Generation failed. Check your connection and try again.';
    state.screen = 'form';
  }

  render();
}

    }
    if (ex.instructions) body.appendChild(h('div', s({border:`1px solid ${B.border}`, borderRadius:8, padding:'12px 14px', fontSize:12.5, color:B.text, lineHeight:'1.55', background:'white', marginBottom:10}), ex.instructions));
    if (ex.precautions) body.appendChild(h('div', s({background:'#FEF3C7', borderLeft:'3px solid #D97706', borderRadius:8, padding:'11px 13px', fontSize:12, color:'#92400E', lineHeight:'1.5'}), '! ' + ex.precautions));
  }
  }

  // Monitoring
  if ((p.monitoring || []).length) {
    body.appendChild(planSection('WHAT WE MONITOR', B.navy));
    p.monitoring.forEach((m, i) => {
      const card = h('div', s({background: i % 2 ? B.bg : 'white', border:`1px solid ${B.border}`, borderRadius:8, padding:'10px 13px', marginBottom:8}));
      card.appendChild(h('div', s({fontSize:12.5, fontWeight:700, color:B.navy, marginBottom:4}), m.measure || ''));
      const grid = h('div', s({display:'grid', gridTemplateColumns:'auto 1fr', gap:'3px 10px', fontSize:11.5}));
      [['When', m.when, B.muted], ['Normal', m.normal_range, B.muted], ['Call us if', m.call_if, B.red]].forEach(([k, v, c]) => {
        grid.appendChild(h('div', s({color:B.muted, fontWeight:600}), k));
        grid.appendChild(h('div', s({color:c, lineHeight:'1.4'}), v || '—'));
      });
      card.appendChild(grid);
      body.appendChild(card);
    });
  }

  // Safety
  if ((p.safety_at_home || []).length) {
    body.appendChild(planSection('STAYING SAFE AT HOME', B.blue));
    p.safety_at_home.forEach(sfy => {
      const row = h('div', s({display:'flex', gap:9, background:B.blueLt, borderRadius:8, padding:'10px 13px', marginBottom:7}));
      row.appendChild(h('div', s({color:B.blue, fontWeight:700, fontSize:12, flexShrink:0}), '✓'));
      row.appendChild(h('div', s({fontSize:12.5, color:B.text, lineHeight:'1.45'}), sfy));
      body.appendChild(row);
    });
  }

  // When to call
  if ((p.contact_criteria || []).length) {
    body.appendChild(planSection('WHEN TO CALL US', B.navy));
    p.contact_criteria.forEach(cc => {
      const row = h('div', s({display:'flex', gap:9, background:B.bg, borderRadius:8, padding:'10px 13px', marginBottom:6}));
      row.appendChild(h('div', s({color:B.blue, fontSize:14, lineHeight:'1', flexShrink:0}), '•'));
      row.appendChild(h('div', s({fontSize:12.5, color:B.text, lineHeight:'1.45'}), cc));
      body.appendChild(row);
    });
    const esc = h('div', s({background:B.blueLt, borderRadius:8, padding:'10px 13px', marginTop:8, display:'flex', gap:8, flexWrap:'wrap'}));
    esc.appendChild(h('div', s({fontSize:12, color:B.muted, fontWeight:600}), 'Escalation:'));
    esc.appendChild(h('div', s({fontSize:12, color:B.navy, fontWeight:700}), p.escalation_pathway));
    body.appendChild(esc);

    // Straight from the assessment, never through the model
    const ct = p.contacts || {};
    const rows = [
      ['Emergency contact', ct.emergency_name, ct.emergency_phone],
      ['Attending doctor',  ct.doctor_name,    ct.doctor_phone]
    ].filter(([, nm, ph]) => (nm || '').trim() || (ph || '').trim());

    if (rows.length) {
      const card = h('div', s({border:`1px solid ${B.border}`, borderRadius:8, padding:'12px 14px', marginTop:10, background:'white'}));
      card.appendChild(h('div', s({fontSize:9.5, fontWeight:700, color:B.muted, letterSpacing:'0.5px', marginBottom:8}), 'YOUR CONTACTS'));
      rows.forEach(([label, nm, ph], i) => {
        const r = h('div', s({display:'flex', justifyContent:'space-between', alignItems:'baseline', gap:10,
          paddingTop: i ? 8 : 0, marginTop: i ? 8 : 0, borderTop: i ? `1px solid ${B.border}` : 'none'}));
        const left = h('div', null);
        left.appendChild(h('div', s({fontSize:10.5, color:B.muted, marginBottom:2}), label));
        left.appendChild(h('div', s({fontSize:13, fontWeight:600, color:B.navy}), (nm || '').trim() || '—'));
        r.appendChild(left);
        if ((ph || '').trim()) {
          const a = h('a', {href:'tel:' + String(ph).replace(/\s+/g,''), style:{
            fontSize:13, fontWeight:700, color:B.blue, textDecoration:'none', flexShrink:0}}, ph);
          r.appendChild(a);
        }
        card.appendChild(r);
      });
      body.appendChild(card);
    }
  }

  // Supplies
  const sup = p.supplies || {};
  if ((sup.kits || []).length || (sup.consumables || []).length) {
    body.appendChild(planSection('SUPPLIES FOR YOUR CARE', B.blue));
    (sup.kits || []).forEach(k => {
      const card = h('div', s({border:`1px solid ${B.border}`, borderRadius:8, padding:'11px 13px', marginBottom:8, background:'white'}));
      const kh = h('div', s({display:'flex', justifyContent:'space-between', alignItems:'flex-start', gap:10, marginBottom:4}));
      const left = h('div', s({display:'flex', gap:7, alignItems:'baseline'}));
      left.appendChild(h('div', s({fontSize:13, fontWeight:700, color:B.navy}), k.name));
      left.appendChild(h('div', s({fontSize:12, fontWeight:700, color:B.blue}), '×' + k.quantity));
      kh.appendChild(left);
      const chargeable = /chargeable/i.test(k.billing || '');
      kh.appendChild(h('div', s({fontSize:10, fontWeight:700, padding:'4px 9px', borderRadius:20, flexShrink:0,
        background: chargeable ? '#FEF3C7' : '#DCFCE7', color: chargeable ? '#92400E' : '#166534'}), k.billing));
      card.appendChild(kh);
      if (k.purpose) card.appendChild(h('div', s({fontSize:11.5, color:B.muted, lineHeight:'1.45'}), k.purpose));
      body.appendChild(card);
    });
    if ((sup.consumables || []).length) {
      body.appendChild(h('div', s({fontSize:9.5, fontWeight:700, color:B.muted, letterSpacing:'0.5px', marginTop:10, marginBottom:4}), 'ALSO PROVIDED'));
      body.appendChild(h('div', s({fontSize:12, color:B.muted, lineHeight:'1.5'}), sup.consumables.join(', ')));
    }
  }

  // Actions
  const acts = h('div', s({marginTop:26}));
  const btnPdf = h('button', {type:'button', style:{width:'100%', padding:'14px 0', borderRadius:10, border:'none', background:B.navy, color:'white', fontSize:15, fontWeight:700, cursor:'pointer', marginBottom:10}}, '⬇  Download care plan PDF');
  btnPdf.addEventListener('click', async () => {
    const original = btnPdf.textContent;
    btnPdf.textContent = 'Generating PDF...'; btnPdf.style.opacity = '0.7';
    try {
      const res = await fetch('/download-caregiver-pdf', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          patient: {
            name: f.name, age: f.age, gender: f.gender, zone: f.zone,
            care_type: f.careType, service_tier: f.serviceTier,
            start_date: f.startDate, assessed_by: f.assessedBy,
            emergency_name: f.emergencyName, emergency_phone: f.emergencyPhone,
            doctor_name: f.doctorName, doctor_phone: f.doctorPhone
          },
          plan: p
        })
      });
      if (!res.ok) throw new Error('PDF generation failed');
      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      const nm = (f.name || 'Patient').replace(/\s+/g, '_');
      const ct = (f.careType || 'CarePlan').replace(/[^a-zA-Z0-9]/g, '_').slice(0, 20);
      a.download = `${nm}_${ct}_${new Date().toISOString().slice(0, 10)}.pdf`;
      a.click();
      URL.revokeObjectURL(url);
      btnPdf.textContent = '✓  Downloaded';
      setTimeout(() => { btnPdf.textContent = original; btnPdf.style.opacity = '1'; }, 2200);
    } catch (err) {
      console.error(err);
      btnPdf.textContent = '✗  Failed — try again';
      btnPdf.style.background = B.red;
      setTimeout(() => { btnPdf.textContent = original; btnPdf.style.background = B.navy; btnPdf.style.opacity = '1'; }, 3000);
    }
  });
  acts.appendChild(btnPdf);

  const row = h('div', s({display:'grid', gridTemplateColumns:'1fr 1fr', gap:10}));
  const btnNew = h('button', {type:'button', style:{padding:'13px 0', borderRadius:10, border:`1px solid ${B.border}`, background:'white', color:B.navy, fontSize:14, fontWeight:500, cursor:'pointer'}}, 'New assessment');
  btnNew.addEventListener('click', () => { window.location.reload(); });
  const btnEdit = h('button', {type:'button', style:{padding:'13px 0', borderRadius:10, border:'none', background:B.blue, color:'white', fontSize:14, fontWeight:600, cursor:'pointer'}}, 'Edit & regenerate');
  btnEdit.addEventListener('click', () => { state.screen = 'form'; state.step = 0; render(); });
  row.appendChild(btnNew); row.appendChild(btnEdit);
  acts.appendChild(row);
  body.appendChild(acts);

  wrap.appendChild(body);
  return wrap;
}

/* ─────────────────────────────────────────────────────────────────
   RENDER LOOP
   ───────────────────────────────────────────────────────────────── */
function render() {
  const app = document.getElementById('app');
  app.innerHTML = '';
  let screen;
  if (state.screen === 'loading') screen = renderLoading();
  else if (state.screen === 'plan' && state.plan) screen = renderPlan();
  else screen = renderForm();
  app.appendChild(screen);
  window.scrollTo(0, 0);
}

render();
</script>
</body>
</html>
