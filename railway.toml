[build]
builder = "NIXPACKS"

[deploy]
startCommand = "npm start"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# Required environment variables (set in Railway → Variables):
#   ANTHROPIC_API_KEY       — Claude API key for care plan generation
#   GOOGLE_DRIVE_FOLDER_ID  — Google Drive folder ID for PDF uploads
#   (also place credentials.json in project root for Drive service account auth)
